<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADHDecoder Board</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f6f7f9; --card:#ffffff; --ink:#1c2230; --muted:#6b7280;
    --line:#e6e8ec; --accent:#3b6ef5; --accent-soft:#eaf0ff;
    --flag:#b4540a; --flag-soft:#fdf1e6; --good:#0f8a5f; --good-soft:#e8f6ef;
    --wait:#7458e0; --wait-soft:#efeafd;
    --watch:#8a8f98;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px 20px 60px;}
  .wrap{max-width:1040px;margin:0 auto;}
  header.top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  h1{font-size:22px;letter-spacing:.5px;margin:0;}
  .sub{color:var(--muted);font-size:13px;}
  .counts{color:var(--muted);font-size:13px;margin:6px 0 14px;}
  .counts b{color:var(--ink);}
  .tabs{display:flex;gap:4px;margin:10px 0 22px;border-bottom:2px solid var(--line);flex-wrap:wrap;}
  .tabbtn{appearance:none;background:none;border:none;font:inherit;font-weight:600;font-size:14px;
    color:var(--muted);padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;
    margin-bottom:-2px;display:inline-flex;align-items:center;gap:7px;}
  .tabbtn:hover{color:var(--ink);}
  .tabbtn.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tbadge{background:#eef0f3;color:var(--muted);border-radius:20px;font-size:11px;padding:1px 8px;font-weight:700;}
  .tabbtn.active .tbadge{background:var(--accent-soft);color:var(--accent);}
  .pane{display:none;}
  .pane.active{display:block;}
  .pane-note{color:var(--muted);font-size:12px;margin:0 0 14px;}
  h2.section{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
    margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .pane h2.section:first-child{margin-top:6px;}
  .today{display:grid;gap:14px;}
  .today-group{margin-bottom:22px;}
  .today-group:last-child{margin-bottom:0;}
  .group-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 10px;}
  .today-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;}
  @media (max-width:700px){.today-grid{grid-template-columns:1fr;}}
  .big{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,30,60,.04);
    height:280px;display:flex;flex-direction:column;overflow:hidden;position:relative;
    cursor:pointer;transition:box-shadow .12s,transform .12s;}
  .big:hover{box-shadow:0 4px 14px rgba(20,30,60,.12);transform:translateY(-1px);}
  .big .step{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border-radius:20px;padding:2px 10px;margin-bottom:8px;align-self:flex-start;}
  .big h3{margin:0 0 6px;font-size:17px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .big .do{margin:8px 0 0;padding:10px 12px;background:#fafbff;border:1px dashed #cdd8f7;border-radius:8px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  /* latest-state context (promise `note`, deadline-override reason) */
  .big .ctx{margin:8px 0 0;font-size:13px;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .big .ctx b{color:var(--ink);font-weight:600;}
  .big .do b{color:var(--accent);}
  .big.clipped::after{content:"";position:absolute;left:0;right:0;bottom:44px;height:34px;
    background:linear-gradient(rgba(255,255,255,0),var(--card));pointer-events:none;}
  .big .expand{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;color:var(--muted);opacity:0;transition:opacity .12s;}
  .big:hover .expand{opacity:1;}
  .big.waiting{border-left-color:var(--wait);}
  .big.waiting .step{color:var(--wait);background:var(--wait-soft);}
  .big.waiting .do b{color:var(--wait);}
  .big.done{border-left-color:var(--good);}
  .big.done .step{color:var(--good);background:var(--good-soft);}
  .big.done .do b{color:var(--good);}
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(20,30,60,.45);
    z-index:50;padding:40px 20px;overflow:auto;}
  .modal-backdrop.open{display:flex;align-items:flex-start;justify-content:center;}
  .modal-card{background:var(--card);border-radius:14px;max-width:640px;width:100%;
    box-shadow:0 16px 48px rgba(20,30,60,.28);position:relative;}
  .modal-close{position:absolute;top:8px;right:12px;border:none;background:none;
    font-size:26px;line-height:1;color:var(--muted);cursor:pointer;z-index:1;padding:4px 8px;}
  .modal-close:hover{color:var(--ink);}
  /* the cloned card fills the modal, unclamped and full-height */
  .modal-body .big{height:auto;overflow:visible;cursor:default;box-shadow:none;border:none;
    border-left:5px solid var(--accent);}
  .modal-body .big:hover{box-shadow:none;transform:none;}
  .modal-body .big.waiting{border-left-color:var(--wait);}
  .modal-body .big.done{border-left-color:var(--good);}
  .modal-body .big h3,.modal-body .big .do,.modal-body .big .ctx{display:block;-webkit-line-clamp:unset;overflow:visible;}
  .modal-body .big.clipped::after{display:none;}
  .modal-body .big .expand{display:none;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;}
  .card h4{margin:0 0 4px;font-size:15px;}
  .card .who{color:var(--muted);font-size:13px;margin:0 0 8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;}
  .c-task{background:var(--good-soft);color:var(--good);}
  .c-need{background:#eef0f3;color:var(--muted);}
  .c-flag{background:var(--flag-soft);color:var(--flag);}
  .c-cust{background:#eef2ff;color:#3550b0;}
  .links{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
    display:flex;gap:16px;flex-wrap:wrap;font-size:13px;}
  .links a{color:var(--accent);text-decoration:none;font-weight:600;}
  .links a:hover{text-decoration:underline;}
  .links a.task{color:var(--good);}
  .big .links{border-top:1px dashed #cdd8f7;margin-top:auto;}
  details{margin-top:6px;}
  summary{cursor:pointer;color:var(--muted);font-size:13px;}
  .watch{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .wrow{background:#eef0f3;color:var(--watch);border-radius:8px;padding:8px 11px;font-size:13px;
    display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;}
  .wrow a{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
  .wins{display:flex;flex-direction:column;gap:6px;}
  .win{background:var(--good-soft);border:1px solid #cfe7da;border-radius:8px;padding:8px 12px;
    font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .win .wd{color:var(--good);font-weight:700;font-size:12px;min-width:56px;}
  .win .wc{color:var(--muted);font-size:12px;margin-left:auto;}
  .win a{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
  .winmore{color:var(--muted);font-size:12px;margin-top:2px;}
  .waitlist{display:flex;flex-direction:column;gap:8px;}
  .waitrow{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .waitrow .ww{color:var(--ink);font-weight:700;font-size:13px;min-width:150px;}
  .waitrow .since{color:var(--muted);font-size:12px;}
  .waitrow .wl{margin-left:auto;}
  .waitrow a{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
  .legend{margin-top:26px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .calm{margin:0 0 4px;padding:12px 14px;background:#eef6f1;border:1px solid #cfe7da;border-radius:10px;color:#0f6b49;font-size:14px;}
  .histlist{display:flex;flex-direction:column;gap:8px;}
  .hist{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .hist>summary{cursor:pointer;list-style:none;padding:12px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .hist>summary::-webkit-details-marker{display:none;}
  .hist>summary::before{content:"▸";color:var(--muted);font-size:13px;line-height:1;transition:transform .15s;}
  .hist[open]>summary::before{transform:rotate(90deg);}
  .hist>summary:hover{background:#fafbfc;}
  .hist .hdate{color:var(--good);font-weight:700;font-size:12px;min-width:50px;}
  .hist .htitle{font-weight:600;font-size:14px;color:var(--ink);flex:1;min-width:180px;}
  .hist .hbody{padding:4px 16px 16px 16px;border-top:1px solid var(--line);font-size:14px;}
  .hist .hbody .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin:13px 0 3px;}
  .hist .hbody p{margin:0 0 4px;}
  .hist .hbody ul{margin:4px 0 0;padding-left:20px;}
  .hist .hbody li{margin-bottom:3px;}
  .hist .hbody .links{margin-top:13px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;font-size:13px;}
  .hist .hbody .links a{color:var(--accent);text-decoration:none;font-weight:600;}
  .hist .hbody .links a:hover{text-decoration:underline;}
  .hist .hbody .links a.task{color:var(--good);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ADHDECODER BOARD</h1>
    <div class="sub">Last swept: <b>{{LAST_SWEPT}}</b></div>
  </header>
  <div class="counts">{{COUNTS}}</div>
  <nav class="tabs">
    <button class="tabbtn active" data-pane="pane-board">Board</button>
    <button class="tabbtn" data-pane="pane-shipped">Shipped <span class="tbadge">{{N_SHIPPED}}</span></button>
    <button class="tabbtn" data-pane="pane-waiting">Waiting on Others <span class="tbadge">{{N_WAITING}}</span></button>
    <button class="tabbtn" data-pane="pane-tomorrow">Tomorrow's Headlines <span class="tbadge">{{N_TOMORROW}}</span></button>
    <button class="tabbtn" data-pane="pane-history">History <span class="tbadge">{{N_HISTORY}}</span></button>
  </nav>

  <div class="pane active" id="pane-board">
    <div class="calm">{{BOARD_NOTE}}</div>
    <h2 class="section">Today</h2>
    <div class="legend" style="margin-top:0;margin-bottom:14px">
      <span><span class="dot" style="background:var(--accent)"></span> Blue = your move</span>
      <span><span class="dot" style="background:var(--wait)"></span> Purple = waiting, no clear action</span>
      <span><span class="dot" style="background:var(--good)"></span> Green = done</span>
      <span><span class="dot" style="background:var(--flag)"></span> Orange = flag</span>
    </div>
    <!-- RENDER today color groups here: one .today-group per non-empty state, in
         order Ready to close (green) / Your move (blue) / Waiting (purple) /
         Done today (green); each group's .big cards go in its .today-grid
         (2 columns). Ready to close leads and is not optional. -->
  </div>

  <div class="pane" id="pane-shipped"><div class="wins"><!-- RENDER .win rows here --></div></div>
  <div class="pane" id="pane-waiting"><div class="waitlist"><!-- RENDER .waitrow rows here --></div></div>
  <div class="pane" id="pane-tomorrow"><div class="today"><!-- RENDER upcoming .big cards here --></div></div>
  <div class="pane" id="pane-history"><div class="histlist"><!-- RENDER .hist details cards here --></div></div>

</div>

<div class="modal-backdrop" id="cardModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" type="button" aria-label="Close">&times;</button>
    <div class="modal-body"></div>
  </div>
</div>

<!--
  CARD TEMPLATES - the renderer emits these from the ledger. EVERY value comes
  from the user's own ledger + config; this template stores NO data.

  Today color group (one per non-empty state; label + dot color per state, in this
  fixed order: var(--good)/"Ready to close (confirm)" green,
  var(--accent)/"Your move" blue, var(--wait)/"Waiting, no clear action" purple,
  var(--good)/"Done today" green). FOUR groups, not three. Ready to close and
  Done today share the .big.done variant (there is no fifth colour), so the GROUP
  LABEL is what tells them apart - always emit it. Emit the state's .big cards
  into its .today-grid:
    <div class="today-group">
      <div class="group-label"><span class="dot" style="background:var(--accent)"></span> Your move</div>
      <div class="today-grid">
        ... this state's .big cards ...
      </div>
    </div>

  Today card (state class: default = your move / blue; add .waiting = purple;
  add .done = green, used by both Ready to close and Done today):
    <div class="big">
      <span class="step">your move - SHORT_STATE_NOTE</span>
      <h3>WHAT</h3>
      <div class="chips" style="margin-bottom:6px">
        <span class="chip c-cust">CONTEXT</span>
        <span class="chip c-flag">FLAG_ONLY_IF_REAL</span>
        <span class="chip c-task">VERIFY_STATUS</span>
      </div>
      <div class="do"><b>First action:</b> ONE_SMALL_NEXT_MOVE</div>
      optional context: the promise's `note` (latest state) and, on a soft
      date, `itemMeta.deadlineTypeReason`. Omit the div when both are absent.
      <div class="ctx"><b>Soft date:</b> WHY_THE_DEADLINE_WAS_OVERRIDDEN LATEST_STATE_NOTE</div>
      <div class="links">
        <a href="SOURCE_URL" target="_blank">source</a>
        <a class="task" href="RECORD_LINK">record</a>
      </div>
    </div>

  Waiting-on-Others row:
    <div class="waitrow"><span class="ww">WHAT</span><span class="since">OWNER - N days waiting</span><span class="wl"><a href="SOURCE_URL">source</a></span></div>

  Shipped win:
    <div class="win"><span class="wd">DATE</span><span>WHAT</span><span class="wc">CONTEXT</span><a href="SOURCE_URL">source</a></div>

  History card:
    <details class="hist"><summary><span class="hdate">DATE</span><span class="htitle">WHAT</span><span class="chip c-cust">CONTEXT</span></summary>
      <div class="hbody"><div class="lbl">What happened</div><p>SUMMARY_OF_CLOSE</p>
        <div class="links"><a href="SOURCE_URL" target="_blank">source</a></div></div></details>
-->

<script>
  document.querySelectorAll('.tabbtn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tabbtn').forEach(function(x){x.classList.remove('active');});
      document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      document.getElementById(b.dataset.pane).classList.add('active');
    });
  });

  // Uniform-size cards clip overflow; click a card to open the full content in a modal.
  var modal = document.getElementById('cardModal');
  var modalBody = modal.querySelector('.modal-body');
  function closeModal(){ modal.classList.remove('open'); modalBody.innerHTML = ''; }
  modal.addEventListener('click', function(e){
    if (e.target === modal || e.target.closest('.modal-close')) closeModal();
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

  function isClipped(card){
    // the card itself always fits; clipping shows up on the clamped children
    return [].some.call(card.querySelectorAll('h3,.do,.ctx,.chips'), function(el){
      return el.scrollHeight > el.clientHeight + 1;
    });
  }
  document.querySelectorAll('.big').forEach(function(card){
    // flag cards whose content is clipped, and add an expand hint
    if (isClipped(card)) {
      card.classList.add('clipped');
      var hint = document.createElement('span');
      hint.className = 'expand';
      hint.textContent = '⤢ expand';
      card.appendChild(hint);
    }
    card.addEventListener('click', function(e){
      if (e.target.closest('a')) return; // let source/record links work normally
      modalBody.innerHTML = '';
      modalBody.appendChild(card.cloneNode(true));
      modal.classList.add('open');
    });
  });
</script>
</body>
</html>
